[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porereax"
dynamic = ["version"]
authors = [
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"}
]
maintainers = [
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"}
]
description = "A tool for analysing and generating reactive simulations using ReaxFF and LAMMPS."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["pore", "ReaxFF", "LAMMPS", "molecular dynamics", "simulation", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "ovito>=3.10",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/ProkopK/PoreReax"
Repository = "https://github.com/ProkopK/PoreReax"
Documentation = "https://prokopk.github.io/PoreReax/"
Issues = "https://github.com/ProkopK/PoreReax/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/porereax"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/porereax/templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.dynamic]
version = {attr = "porereax.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["porereax*"]

[tool.setuptools.package-data]
porereax = [
    "templates/**/*",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
