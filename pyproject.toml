[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porereax"
version = "0.0.1"
authors = [
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"}
]
maintainers = [
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"}
]
description = "A tool for generating and analysing reactive pore simulations using ReaxFF and LAMMPS."
readme = "README.md"
license = {text = "GNU General Public License v3.0"}
keywords = ["pore", "ReaxFF", "LAMMPS", "molecular dynamics", "simulation", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "ovito",
    "matplotlib",
    "jinja2",
    "pyyaml",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-autodoc-typehints>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/ProkopK/PoreReax"
Repository = "https://github.com/ProkopK/PoreReax"
Issues = "https://github.com/ProkopK/PoreReax/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=src/porereax --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/porereax"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/porereax/templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["src"]
include = ["porereax*"]

[tool.setuptools.package-data]
porereax = [
    "templates/**/*",
]
